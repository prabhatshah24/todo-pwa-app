<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
    rel="stylesheet"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />

  <link rel="manifest" href="manifest.json">

    <link rel="icon" href="icons/logo.jpg">

</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark">
    <div class="container">
      <span class="navbar-brand fw-bold">Todo App</span>
    </div>
  </nav>

  <!-- Tasks -->
  <div class="container mt-4" id="taskContainer"></div>

  <!-- Floating Add Button -->
  <button
    class="btn btn-primary btn-add"
    data-bs-toggle="modal"
    data-bs-target="#addTaskModal"
  >
    +
  </button>

  <!-- Add Task Modal -->
  <div class="modal fade" id="addTaskModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-light">

        <div class="modal-header">
          <h5 class="modal-title">Add New Task</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <form class="modal-body" id="addTaskForm">

          <div class="mb-3">
            <label class="form-label">Task</label>
            <input type="text" class="form-control" id="taskTitle" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Deadline</label>
            <input type="date" class="form-control" id="taskDeadline"  />
          </div>

          <div class="mb-3">
            <label class="form-label">Priority</label>
            <select class="form-select " id="taskPriority" >
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary w-100" id="tasksubmitBtn">
            Add Task
          </button>

        </form>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
